// Flashcards
function Flashcards() {
  const [index, setIndex] = useState(0);
  const [showVerso, setShowVerso] = useState(false);
  const [sabia, setSabia] = useState([]);
  const [naoSabia, setNaoSabia] = useState([]);
  const [reviewMode, setReviewMode] = useState(false);
  const [startFrom, setStartFrom] = useState(0);

  const cards = reviewMode ? naoSabia.map(i => flashcards[i]) : flashcards.slice(startFrom);

  function handleSabia() {
    setSabia([...sabia, index + (reviewMode ? 0 : startFrom)]);
    next();
  }
  function handleNaoSabia() {
    setNaoSabia([...naoSabia, index + (reviewMode ? 0 : startFrom)]);
    next();
  }
  function next() {
    setShowVerso(false);
    setIndex((i) => (i + 1 < cards.length ? i + 1 : 0));
  }
  function prev() {
    setShowVerso(false);
    setIndex((i) => (i > 0 ? i - 1 : 0));
  }
  function handleReviewNaoSabia() {
    setReviewMode(true);
    setIndex(0);
  }
  function handleStartFrom(e) {
    setStartFrom(Number(e.target.value));
    setIndex(0);
    setShowVerso(false);
    setReviewMode(false);
  }

  return (
    <div>
      <h2>Flashcards</h2>
      <div>
        <label>
          Escolher a partir de qual flashcard começar:{" "}
          <select value={startFrom} onChange={handleStartFrom}>
            {flashcards.map((_, i) => (
              <option key={i} value={i}>
                {i + 1}
              </option>
            ))}
          </select>
        </label>
      </div>
      <div style={{ margin: "1em 0", padding: 16, border: "2px solid #1976d2", borderRadius: 8, background: "#f5f5f5" }}>
        <div style={{ fontWeight: "bold", fontSize: 18 }}>
          {showVerso ? "Verso" : "Frente"}
        </div>
        <div style={{ fontSize: 20, margin: "1em 0" }}>
          {showVerso ? cards[index].verso : cards[index].frente}
        </div>
        <button onClick={() => setShowVerso((v) => !v)} style={{ marginRight: 8 }}>
          {showVerso ? "Ver Frente" : "Ver Resposta"}
        </button>
        <button onClick={prev} style={{ marginRight: 8 }}>Anterior</button>
        <button onClick={next}>Próximo</button>
        <div style={{ marginTop: 8 }}>
          <button onClick={handleSabia} style={{ background: "#00e676", color: "#222", marginRight: 8 }}>Sabia</button>
          <button onClick={handleNaoSabia} style={{ background: "#ff1744", color: "#fff" }}>Não sabia</button>
        </div>
        <div style={{ marginTop: 8 }}>
          <button onClick={() => alert(cards[index].dica)}>Dica</button>
        </div>
        {showVerso && (
          <div style={{ marginTop: 8, color: "#1976d2" }}>
            <div><b>Definição resumida:</b> {cards[index].verso}</div>
            <div><b>Dica de memorização:</b> {cards[index].memorizacao || cards[index].mnem}</div>
            <div><b>Visualização/Associação:</b> {cards[index].visual}</div>
            <div><b>Pegadinha:</b> {cards[index].pegadinha}</div>
          </div>
        )}
        <div style={{ marginTop: 8 }}>
          <b>Progresso:</b> {index + 1} / {cards.length}
        </div>
      </div>
      <div>
        <button onClick={handleReviewNaoSabia} disabled={naoSabia.length === 0}>
          Rever flashcards que não sabia ({naoSabia.length})
        </button>
      </div>
    </div>
  );
}

// Consulta do conteúdo (busca por palavra)
function ConsultaConteudo() {
  const [busca, setBusca] = useState("");
  const [resultados, setResultados] = useState([]);
  function handleBusca(e) {
    setBusca(e.target.value);
    if (e.target.value.length < 2) {
      setResultados([]);
      return;
    }
    const termo = e.target.value.toLowerCase();
    let res = [];
    resumoCompleto.forEach((bloco) => {
      bloco.conteudo.forEach((linha) => {
        if (linha.toLowerCase().includes(termo)) {
          res.push({ bloco: bloco.bloco, texto: linha });
        }
      });
    });
    setResultados(res);
  }
  return (
    <div>
      <h2>Consulta do Conteúdo</h2>
      <input
        type="text"
        placeholder="Digite uma palavra-chave..."
        value={busca}
        onChange={handleBusca}
        style={{ width: "100%", padding: 8, fontSize: 16, marginBottom: 8 }}
      />
      <div>
        {resultados.length === 0 && busca.length > 1 && (
          <div style={{ color: "#888" }}>Nenhum resultado encontrado.</div>
        )}
        {resultados.map((r, i) => (
          <div key={i} style={{ margin: "8px 0", padding: 8, background: "#f5f5f5", borderRadius: 4 }}>
            <b>{r.bloco}:</b> {r.texto}
          </div>
        ))}
      </div>
    </div>
  );
}

// Questões Padrões
function QuestoesPadrao() {
  const [index, setIndex] = useState(0);
  const [resposta, setResposta] = useState("");
  const [confirmado, setConfirmado] = useState(false);
  const [acertos, setAcertos] = useState([]);
  const [erros, setErros] = useState([]);
  function handleConfirmar() {
    setConfirmado(true);
    if (resposta === questoesPadrao[index].resposta) {
      setAcertos([...acertos, index]);
    } else {
      setErros([...erros, index]);
    }
  }
  function next() {
    setConfirmado(false);
    setResposta("");
    setIndex((i) => (i + 1 < questoesPadrao.length ? i + 1 : 0));
  }
  function prev() {
    setConfirmado(false);
    setResposta("");
    setIndex((i) => (i > 0 ? i - 1 : 0));
  }
  function refazerErradas() {
    setIndex(erros[0] || 0);
    setErros([]);
    setAcertos([]);
    setConfirmado(false);
    setResposta("");
  }
  return (
    <div>
      <h2>Questões Padrões</h2>
      <div style={{ margin: "1em 0", padding: 16, border: "2px solid #1976d2", borderRadius: 8, background: "#f5f5f5" }}>
        <div style={{ whiteSpace: "pre-line" }}>{questoesPadrao[index].enunciado}</div>
        <div>
          {questoesPadrao[index].alternativas.map((alt, i) => (
            <div key={i}>
              <label>
                <input
                  type="radio"
                  name="resposta"
                  value={alt[0]}
                  checked={resposta === alt[0]}
                  onChange={() => setResposta(alt[0])}
                  disabled={confirmado}
                />
                {alt}
              </label>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 8 }}>
          <button onClick={prev}>Anterior</button>
          <button onClick={next} style={{ marginLeft: 8 }}>Próxima</button>
        </div>
        <div style={{ marginTop: 8 }}>
          <button onClick={handleConfirmar} disabled={confirmado || !resposta}>Confirmar</button>
          <button onClick={() => alert("Dica: Leia com atenção o enunciado!")}>Dica</button>
        </div>
        {confirmado && (
          <div style={{ marginTop: 8, color: resposta === questoesPadrao[index].resposta ? "#00e676" : "#ff1744" }}>
            {resposta === questoesPadrao[index].resposta ? "Correto!" : `Errado. Resposta correta: ${questoesPadrao[index].resposta}`}
            <div style={{ color: "#1976d2" }}>Dica de memorização: {dicasFixacao[index % dicasFixacao.length]}</div>
          </div>
        )}
        <div style={{ marginTop: 8 }}>
          <b>Progresso:</b> {index + 1} / {questoesPadrao.length}
        </div>
      </div>
      <div>
        <button onClick={refazerErradas} disabled={erros.length === 0}>
          Refazer questões erradas ({erros.length})
        </button>
      </div>
    </div>
  );
}
